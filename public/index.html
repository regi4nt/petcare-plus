<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#818cf8" />
    <meta name="description" content="PetCare+ — Pantau kesehatan hewan peliharaanmu dengan teknologi IoT. Jadwal, rekam medis, dan monitoring real-time." />
    <meta name="keywords" content="petcare, hewan peliharaan, kesehatan hewan, IoT, monitoring, kucing, anjing" />
    <meta name="author" content="PetCare+" />

    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="alternate icon" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.svg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="PetCare+ — Pantau Kesehatan Hewan Peliharaan" />
    <meta property="og:description" content="Aplikasi pemantauan kesehatan hewan peliharaan dengan IoT, jadwal, dan rekam medis terintegrasi." />
    <meta property="og:image" content="%PUBLIC_URL%/logo.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PetCare+" />
    <meta name="twitter:description" content="Pantau kesehatan hewan peliharaanmu secara real-time." />
    <meta name="twitter:image" content="%PUBLIC_URL%/logo.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <title>PetCare+</title>

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body { width: 100%; height: 100%; background-color: #0f0c2e; }
      #root { width: 100%; height: 100%; background: transparent; }

      /* Layout persis sama dengan React Spinner component:
         flex-col, items-center, justify-center, semua di tengah */
      #splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: linear-gradient(135deg, #0f0c2e 0%, #1a1040 50%, #0f0c2e 100%);
        z-index: 9999;
        transition: opacity 0.35s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }

      #splash-logo {
        width: 96px; height: 96px;
        border-radius: 24px;
        box-shadow: 0 16px 60px rgba(99,85,220,0.5), 0 4px 16px rgba(0,0,0,0.4);
        animation: logoIn 0.45s cubic-bezier(0.34,1.56,0.64,1) both;
        margin-bottom: 20px;
      }

      #splash-title {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-size: 22px; font-weight: 800;
        color: #ffffff; letter-spacing: -0.3px;
        animation: fadeUp 0.4s 0.15s ease both;
        opacity: 0;
        margin-bottom: 20px;
      }

      /* Spinner PERSIS sama dengan React Spinner:
         32px, border 3px solid transparent, borderTopColor #818cf8, 0.8s linear */
      #splash-spinner {
        width: 32px; height: 32px;
        border: 3px solid transparent;
        border-top-color: #818cf8;
        border-radius: 50%;
        animation: fadeUp 0.35s 0.3s ease both, spin 0.8s 0.3s linear infinite;
        opacity: 0;
      }

      @keyframes logoIn {
        from { opacity:0; transform:scale(0.82); }
        to   { opacity:1; transform:scale(1); }
      }
      @keyframes fadeUp {
        from { opacity:0; transform:translateY(8px); }
        to   { opacity:1; transform:translateY(0); }
      }
      @keyframes spin { to { transform:rotate(360deg); } }
    </style>
  </head>
  <body>

    <div id="splash">
      <img id="splash-logo" src="%PUBLIC_URL%/logo.svg" alt="PetCare+" />
      <p id="splash-title">PetCare+</p>
      <div id="splash-spinner"></div>
    </div>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script>
      (function () {
        var splash = document.getElementById('splash');
        if (!splash) return;
        var observer = new MutationObserver(function () {
          var root = document.getElementById('root');
          // Tunggu sampai ada elemen yang benar-benar bermakna (bukan null/kosong dari React)
          if (root && root.children.length > 0 && root.innerHTML.trim() !== '') {
            splash.classList.add('hide');
            setTimeout(function () {
              if (splash.parentNode) splash.parentNode.removeChild(splash);
            }, 450);
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true, subtree: true });
      })();
    </script>

  </body>
</html>
