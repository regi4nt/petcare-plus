<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#818cf8" />
    <meta name="description" content="PetCare+ — Pantau kesehatan hewan peliharaanmu dengan teknologi IoT. Jadwal, rekam medis, dan monitoring real-time." />
    <meta name="keywords" content="petcare, hewan peliharaan, kesehatan hewan, IoT, monitoring, kucing, anjing" />
    <meta name="author" content="PetCare+" />

    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="alternate icon" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.svg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="PetCare+ — Pantau Kesehatan Hewan Peliharaan" />
    <meta property="og:description" content="Aplikasi pemantauan kesehatan hewan peliharaan dengan IoT, jadwal, dan rekam medis terintegrasi." />
    <meta property="og:image" content="%PUBLIC_URL%/logo.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PetCare+" />
    <meta name="twitter:description" content="Pantau kesehatan hewan peliharaanmu secara real-time." />
    <meta name="twitter:image" content="%PUBLIC_URL%/logo.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <title>PetCare+</title>

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100%; height: 100%;
        background-color: #0f0c2e;
        background: linear-gradient(to bottom, #0f0c2e, #1e1b4b, #0f172a);
      }

      #root { width: 100%; height: 100%; background: transparent; }

      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(to bottom, #0f0c2e, #1e1b4b, #0f172a);
        z-index: 9999;
        transition: opacity 0.4s ease;
        padding: 0 32px;
      }

      #splash.hide { opacity: 0; pointer-events: none; }

      #splash-logo {
        width: 96px; height: 96px;
        border-radius: 24px;
        box-shadow: 0 32px 80px rgba(49,46,129,0.8), 0 8px 24px rgba(0,0,0,0.45);
        margin-bottom: 24px;
        animation: splashIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
      }

      #splash-title {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-size: 30px; font-weight: 900;
        color: #ffffff; letter-spacing: -0.5px;
        margin-bottom: 4px;
        text-align: center;
        animation: splashIn 0.6s 0.15s cubic-bezier(0.34,1.56,0.64,1) both; opacity: 0;
      }

      #splash-title span { color: #818cf8; }

      #splash-spinner {
        width: 32px; height: 32px;
        border: 3px solid rgba(129,140,248,0.2);
        border-top-color: #818cf8;
        border-radius: 50%;
        margin-top: 48px;
        animation: splashIn 0.5s 0.4s ease both, spin 0.9s 0.4s linear infinite;
        opacity: 0;
      }

      @keyframes splashIn {
        from { opacity:0; transform:translateY(18px); }
        to   { opacity:1; transform:translateY(0); }
      }
      @keyframes spin { to { transform:rotate(360deg); } }
    </style>
  </head>
  <body>

    <div id="splash">
      <img id="splash-logo" src="%PUBLIC_URL%/logo.svg" alt="PetCare+" />
      <p id="splash-title">PetCare<span>+</span></p>
      <div id="splash-spinner"></div>
    </div>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script>
      (function () {
        var splash = document.getElementById('splash');
        if (!splash) return;
        var observer = new MutationObserver(function () {
          var root = document.getElementById('root');
          // Tunggu sampai ada elemen yang benar-benar bermakna (bukan null/kosong dari React)
          if (root && root.children.length > 0 && root.innerHTML.trim() !== '') {
            splash.classList.add('hide');
            setTimeout(function () {
              if (splash.parentNode) splash.parentNode.removeChild(splash);
            }, 450);
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true, subtree: true });
      })();
    </script>

  </body>
</html>
